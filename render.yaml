services:
  - type: web
    name: readaloud-pdf
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: readaloud-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        value: friends2025
      - key: STORAGE_DIR
        value: ./storage
      - key: CORS_ORIGINS
        value: https://readaloud-pdf.onrender.com
      - key: MAX_UPLOAD_MB
        value: "100"

databases:
  - name: readaloud-db
    plan: free
    databaseName: readaloud
    user: readaloud
