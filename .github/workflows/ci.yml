name: CI Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-check:
    name: Backend Syntax & Tests
    runs-on: ubuntu-latest
    services:
      postgres:  # search uses Postgres full-text search, so its tests need a real database
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: him_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Check Python syntax & run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/him_test
        run: |
          python -m compileall app
          if [ -d "tests" ]; then python -m pytest -q; fi  # -m puts backend/ on the path so tests can import app

  frontend-builds:
    name: Build Static Frontends (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, frontend-admin, frontend-stt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install & Build ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: ""
        run: |
          npm ci
          npm run build
